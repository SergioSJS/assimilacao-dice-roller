name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Extract version and set URLs
        id: vars
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          DOWNLOAD="https://github.com/${{ github.repository }}/releases/download/${TAG}/assimilacao-dice-roller.zip"
          echo "TAG=${TAG}" >> $GITHUB_OUTPUT
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "DOWNLOAD=${DOWNLOAD}" >> $GITHUB_OUTPUT

      - name: Update module.json version and download URL
        run: |
          jq --arg version "${{ steps.vars.outputs.VERSION }}" \
             --arg download "${{ steps.vars.outputs.DOWNLOAD }}" \
             '.version = $version | .download = $download' \
             module.json > module.json.tmp
          mv module.json.tmp module.json

      - name: Commit updated module.json to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add module.json
          git diff --staged --quiet || git commit -m "chore: release ${{ steps.vars.outputs.TAG }}"
          git push origin main

      - name: Build module zip
        run: |
          zip -r assimilacao-dice-roller.zip \
            module.json \
            css/ \
            modules/ \
            images/ \
            LICENSE \
            -x "images/*.psd" \
            -x "images/*.clip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.TAG }}
          name: "Assimilacao Dice Roller ${{ steps.vars.outputs.TAG }}"
          generate_release_notes: true
          files: |
            assimilacao-dice-roller.zip
            module.json
